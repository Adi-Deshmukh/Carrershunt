[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carrershunt"
version = "0.2.0"
description = "AI-powered job discovery and resume tailoring platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.28,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-docx>=1.1,<2.0",
    "pypdf>=5.0,<7.0",
    "openai>=1.100,<2.0",
    "langgraph==1.2.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
